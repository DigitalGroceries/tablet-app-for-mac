name: signed-check

# Zak, 19 Nov 2026 (team rule 3.11): every code change is signed as DigitalGroceries
# <222060208+DigitalGroceries@users.noreply.github.com>, with no AI agent line (no Co-Authored-By, no session line,
# no "Generated by"). Nobody has to remember it: this check fails a push or pull request that breaks it.
# Only commits made after the rule (19 Nov 2026 14:45 UTC) are checked; older history is left as it is.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  signed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check author and message of the new commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE:-}" ]; then RANGE="$BASE..$HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then RANGE="$BEFORE..$AFTER"
          else RANGE="$AFTER~1..$AFTER"; fi
          echo "Checking $RANGE"
          RULE_TS=$(date -u -d '2026-11-19T14:45:00Z' +%s)
          bad=0
          for c in $(git rev-list --no-merges "$RANGE"); do
            ts=$(git show -s --format=%ct "$c")
            [ "$ts" -lt "$RULE_TS" ] && continue
            email=$(git show -s --format=%ae "$c")
            if [ "$email" != "222060208+DigitalGroceries@users.noreply.github.com" ]; then
              echo "::error::$c is signed by '$email', not DigitalGroceries (team rule 3.11)"; bad=1
            fi
            if git show -s --format=%B "$c" | grep -Eiq '^(co-authored-by:|claude-session:)|generated with \[?claude|generated by (claude|devin|grok)'; then
              echo "::error::$c has an AI agent line in its message (team rule 3.11)"; bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "All new commits are signed as DigitalGroceries with no AI agent line."
          exit $bad
