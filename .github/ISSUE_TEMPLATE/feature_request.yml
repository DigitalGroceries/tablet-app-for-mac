name: Feature request
description: Suggest a change or a new function.
labels: [enhancement]
body:
  - type: markdown
    attributes: {value: "Feedback is read once a week."}
  - type: textarea
    id: what
    attributes: {label: What you want to do, description: "The task, the app (Photoshop, Affinity, …) and where in Tablet App for Mac it belongs."}
    validations: {required: true}
  - type: textarea
    id: now
    attributes: {label: How you do it now}
  - type: input
    id: tablet
    attributes: {label: Tablet model}
