name: Feature request
description: Suggest a change or a new function.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes: {label: What you want to do, description: "The task, the app (Photoshop, Affinity, …) and where in Tablet App for Mac it belongs."}
    validations: {required: true}
  - type: textarea
    id: now
    attributes: {label: How you do it now}
  - type: input
    id: tablet
    attributes: {label: Tablet model}
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or pictures (optional)
      description: "Drag them here, or click to choose. Everything posted here is public, so leave out personal details."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mov,.mp4"
