name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: input
    id: app
    attributes: {label: App version, description: "From Home, at the end of the About line (for example Version 15).", placeholder: "15"}
    validations: {required: true}
  - type: input
    id: macos
    attributes: {label: macOS version, placeholder: "27.0.1"}
    validations: {required: true}
  - type: input
    id: tablet
    attributes: {label: Tablet model, placeholder: "Wacom Intuos4 Small (PTK-440)"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. Open Tablet › Pen\n2. …"}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected and actual result}
    validations: {required: true}
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: "Drag them here, or click to choose. On a Mac, Shift-Command-4 takes a screenshot of part of the screen. Everything posted here is public, so leave out personal details."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mov,.mp4,.txt,.log,.zip"
  - type: textarea
    id: extra
    attributes: {label: Log (optional), description: "Advanced › Console › Copy as Markdown, then paste here."}
